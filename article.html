<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article - HappyPulse</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="main-container">
        <div class="news-container">
            <button class="back-btn" onclick="goBack()">← Back to News</button>
            
            <article class="article-content">
                <div class="article-header">
                    <span class="news-category" id="articleCategory"></span>
                    <span class="news-time" id="articleTime"></span>
                    <span class="news-impact" id="articleImpact"></span>
                </div>
                
                <h1 class="article-title" id="articleTitle"></h1>
                
                <div class="article-body">
                    <p class="article-summary" id="articleSummary"></p>
                    
                    <div class="article-content-body" id="articleBody">
                        <!-- Full article content will be loaded here -->
                    </div>
                </div>
                
                <div class="article-footer">
                    <p class="article-note">✨ This is a curated positive news story designed to brighten your day!</p>
                    <button class="back-btn secondary" onclick="goBack()">← Back to More Good News</button>
                </div>
            </article>
        </div>
    </main>

    <script src="article.js"></script>
</body>
</html>
